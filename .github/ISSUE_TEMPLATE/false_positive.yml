name: False positive
description: Paste Guard warned about something that is not a secret
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not paste a real secret here.** Describe the *shape* of the text instead, or link to public text (documentation, an open-source file).
  - type: input
    id: rule
    attributes:
      label: Which item did it flag?
      description: The label shown in the dialog, for example "Password" or "OpenAI-style API key".
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What did the text look like?
      description: For example "a line in a Python test file, `password = 'test_user_pw'`", or a link to the public file.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it not a secret?
  - type: input
    id: version
    attributes:
      label: Paste Guard version and sensitivity setting
      placeholder: "0.1.0, Balanced"
