nt on AI chat sites. Keys, passwords and personal</text><text x="44" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#9fd9b3">IDs are held back until you redact them, all on your device.</text><rect x="44" y="242" width="156" height="62" rx="10" fill="#00ff66" fill-opacity="0.05" stroke="#00ff66" stroke-opacity="0.28"/><text x="58" y="272" font-family="Consolas,'Courier New',monospace" font-size="24" font-weight="700" fill="#00ff66" filter="url(#gs)">102</text><text x="58" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#5fbf80" letter-spacing="0.6">API KEY FORMATS</text><rect x="212" y="242" width="156" height="62" rx="10" fill="#00ff66" fill-opacity="0.05" stroke="#00ff66" stroke-opacity="0.28"/><text x="226" y="272" font-family="Consolas,'Courier New',monospace" font-size="24" font-weight="700" fill="#00ff66" filter="url(#gs)">355</text><text x="226" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#5fbf80" letter-spacing="0.6">AUTOMATED TESTS</text><rect x="380" y="242" width="156" height="62" rx="10" fill="#00ff66" fill-opacity="0.05" stroke="#00ff66" stroke-opacity="0.28"/><text x="394" y="272" font-family="Consolas,'Courier New',monospace" font-size="24" font-weight="700" fill="#00ff66" filter="url(#gs)">0</text><text x="394" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#5fbf80" letter-spacing="0.6">NETWORK CALLS</text><rect x="44" y="322" width="93" height="24" rx="12.0" fill="#00ff66" fill-opacity="0.08" stroke="#00ff66" stroke-opacity="0.4"/><text x="90.5" y="338.0" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#b6ffcb">JavaScript</text><rect x="145" y="322" width="107" height="24" rx="12.0" fill="#00ff66" fill-opacity="0.08" stroke="#00ff66" stroke-opacity="0.4"/><text x="198.5" y="338.0" text-anchor="middle" font-family="Consolas,'Courier New',monospa