<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste Guard</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header>
    <span class="badge" aria-hidden="true">!</span>
    <h1>Paste Guard</h1>
  </header>

  <section class="status" aria-live="polite">
    <p id="status-line" class="status-line">Checking this tab...</p>
    <p id="status-detail" class="muted"></p>
  </section>

  <div class="actions">
    <button id="site-toggle" type="button" hidden></button>
  </div>

  <label class="switch">
    <input id="enabled" type="checkbox">
    <span>Paste Guard is on</span>
  </label>

  <p id="stats" class="muted stats"></p>

  <footer>
    <button id="open-options" type="button">Settings</button>
    <a id="sites-link" href="#" class="muted">Supported sites</a>
  </footer>
</main>

<script src="../engine/validators.js"></script>
<script src="../engine/hash.js"></script>
<script src="../engine/rules.js"></script>
<script src="../engine/detect.js"></script>
<script src="../shared/sites.js"></script>
<script src="../shared/settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
